<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niemann-Pick in 10 Seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one 16:9 SVG stage, transport bar under it, timed voice-over script below. Single dark look by design. */
:root {
  --bg: #0b1220;
  --stage: #0e1626;
  --panel: #182339;
  --line: #2a3754;
  --fg: #eef2f8;
  --muted: #95a3bd;
  --accent: #46d28c;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding: 28px 16px 48px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: 0.01em; }
h1 span { color: var(--accent); }
h2 { font-family: var(--display); font-size: 26px; margin: 0; }
.tag { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.player { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; aspect-ratio: 16 / 9; background: var(--bg); cursor: pointer; }
.stage:fullscreen { aspect-ratio: auto; width: 100vw; height: 100vh; }
#anim { display: block; width: 100%; height: 100%; }
.big-play { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; display: grid; place-items: center; box-shadow: 0 8px 30px rgb(0 0 0 / 0.45); }
.big-play svg { width: 34px; height: 34px; margin-left: 5px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.controls { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
.controls button, .copy { flex: none; height: 36px; min-width: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); color: var(--fg); font: 600 14px var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.controls button:hover, .copy:hover { border-color: var(--muted); }
.controls svg { width: 16px; height: 16px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--accent); }
#clock { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
.script-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.script { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.script button { width: 100%; height: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.script button:hover { border-color: var(--muted); }
.script button.on { border-color: var(--accent); }
.script time { font: 500 12px var(--mono); color: var(--muted); }
.script span { font-size: 18px; font-weight: 600; line-height: 1.35; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
@media (max-width: 560px) { .controls .lbl { display: none; } .controls { gap: 8px; padding: 8px 10px; } }

/* SVG typography */
#anim text { font-family: var(--body); }
#anim .t-title { font: 700 64px var(--display); letter-spacing: 3px; }
#anim .t-chip { font: 600 20px var(--body); letter-spacing: 2.5px; }
#anim .t-lbl { font: 600 26px var(--body); }
#anim .t-big { font: 700 32px var(--body); }
#anim .t-small { font: 600 17px var(--body); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Niemann-Pick Disease <span>in 10 seconds</span></h1>
    <div class="tag">16:9 · voice-over animation</div>
  </header>

  <div class="player">
    <div class="stage" id="stage">
      <svg id="anim" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="An inherited faulty gene leaves the lysosome unable to break down or move cholesterol and sphingomyelin, so the fats pile up and the cell swells.">
        <defs>
          <radialGradient id="bg" cx="50%" cy="55%" r="70%"><stop offset="0" stop-color="#15223b"/><stop offset="1" stop-color="#0b1220"/></radialGradient>
          <radialGradient id="cyto" cx="42%" cy="38%" r="75%"><stop offset="0" stop-color="#1c3256"/><stop offset="1" stop-color="#11203a"/></radialGradient>
          <radialGradient id="lysoFill" cx="38%" cy="34%" r="80%"><stop offset="0" stop-color="#2f8f66" stop-opacity=".6"/><stop offset="1" stop-color="#123b2b" stop-opacity=".7"/></radialGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
          <marker id="arrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9ff0c8"/></marker>
          <g id="xbadge">
            <circle r="17" fill="#ff5a5a" stroke="#0b1220" stroke-width="3"/>
            <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          </g>
          <!-- Cholesterol: fused steroid rings + tail -->
          <g id="chol" fill="#ffc43c" stroke="#8a6200" stroke-width="1.8" stroke-linejoin="round">
            <polygon points="-19.52,5.5 -29.05,11 -38.58,5.5 -38.58,-5.5 -29.05,-11 -19.52,-5.5"/>
            <polygon points="-0.47,5.5 -10,11 -19.53,5.5 -19.53,-5.5 -10,-11 -0.47,-5.5"/>
            <polygon points="18.58,5.5 9.05,11 -0.48,5.5 -0.48,-5.5 9.05,-11 18.58,-5.5"/>
            <polygon points="18.58,-5.5 18.58,5.5 29,8.9 35.5,0 29,-8.9"/>
            <polyline points="35.5,0 44,-6 52,0" fill="none" stroke="#ffc43c" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- Sphingomyelin: polar head + two fatty tails -->
          <g id="sm">
            <path d="M-4 -6 q-6 7 0 14 t0 14 t0 14 M4 -6 q6 7 0 14 t0 14 t0 14" fill="none" stroke="#ff7ab6" stroke-width="3.5" stroke-linecap="round"/>
            <circle cy="-16" r="10" fill="#ff7ab6" stroke="#7a1f4a" stroke-width="2"/>
          </g>
        </defs>

        <rect width="1600" height="900" fill="url(#bg)"/>

        <!-- Scene 1 (0–2.6 s): inherited faulty gene -->
        <g transform="translate(800 500)">
          <g id="s1" opacity="0">
            <g id="helix"></g>
            <rect x="62" y="-132" width="52" height="264" rx="26" fill="none" stroke="#ff5a5a" stroke-width="3" stroke-dasharray="8 7">
              <animate attributeName="opacity" values=".25;1;.25" dur="1.1s" repeatCount="indefinite"/>
            </rect>
            <text id="faultyLbl" class="t-lbl" x="88" y="174" text-anchor="middle" fill="#ff8080" opacity="0">Faulty gene</text>
          </g>
        </g>

        <!-- Scenes 2–4 (2.5–10 s): the cell -->
        <g transform="translate(820 520)">
          <g id="cell" opacity="0">
            <ellipse rx="520" ry="290" fill="url(#cyto)" stroke="#7fb2ff" stroke-width="6"/>
            <ellipse rx="520" ry="290" fill="none" stroke="#b9d4ff" stroke-width="12" stroke-dasharray="1 13" stroke-linecap="round" opacity=".45"/>
            <ellipse id="cellAlarm" rx="520" ry="290" fill="none" stroke="#ff5a5a" stroke-width="12" filter="url(#glow)" opacity="0"/>

            <!-- ER -->
            <path d="M-184.5 -105.5 A135 135 0 0 1 -184.5 85.5 M-166.9 -123.1 A160 160 0 0 1 -166.9 103.1" fill="none" stroke="#3f6aa8" stroke-width="5" stroke-dasharray="20 9" stroke-linecap="round" opacity=".8"/>
            <!-- Nucleus -->
            <circle cx="-280" cy="-10" r="105" fill="#241f5c" stroke="#8b7bff" stroke-width="4"/>
            <circle cx="-300" cy="-30" r="30" fill="#3d3494"/>
            <path d="M-340 30 q20 -20 40 0 t40 0 M-330 -70 q15 -15 30 0 t30 0" fill="none" stroke="#5a4fc0" stroke-width="3" stroke-linecap="round"/>
            <!-- Mitochondria -->
            <g transform="translate(-100 150) rotate(25)"><ellipse rx="46" ry="20" fill="#6b3346" stroke="#ff8fa3" stroke-width="3"/><path d="M-30 0 q6 -11 12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#ffb3c1" stroke-width="2.5"/></g>
            <g transform="translate(-150 -225) rotate(-15)"><ellipse rx="40" ry="17" fill="#6b3346" stroke="#ff8fa3" stroke-width="3"/><path d="M-26 0 q6.5 -9 13 0 t13 0 t13 0 t13 0" fill="none" stroke="#ffb3c1" stroke-width="2.5"/></g>
            <g transform="translate(440 30) rotate(70)"><ellipse rx="38" ry="17" fill="#6b3346" stroke="#ff8fa3" stroke-width="3"/><path d="M-24 0 q6 -9 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#ffb3c1" stroke-width="2.5"/></g>
            <!-- Vesicles -->
            <g fill="#2e5288" stroke="#5f8fd6" stroke-width="2">
              <circle cx="120" cy="-150" r="10"/><circle cx="-60" cy="-70" r="9"/><circle cx="-20" cy="60" r="11"/><circle cx="300" cy="210" r="9"/>
            </g>
            <!-- Smaller lysosomes (filled by script) -->
            <g id="smallLysos"></g>

            <!-- Lysosome label -->
            <g id="lysoLbl" opacity="0">
              <path d="M262 -72 L318 -168" stroke="#9ff0c8" stroke-width="2.5" fill="none"/>
              <text class="t-lbl" x="300" y="-180" fill="#9ff0c8" stroke="#0b1220" stroke-width="5" paint-order="stroke">Lysosome</text>
            </g>

            <!-- Main lysosome -->
            <g transform="translate(200 20)">
              <g id="lyso">
                <circle id="lysoGlow" r="115" fill="none" stroke="#46d28c" stroke-width="14" filter="url(#glow)" opacity="0"/>
                <circle id="lysoMem" r="115" fill="url(#lysoFill)" stroke="#46d28c" stroke-width="5"/>
                <g id="flyins"></g>
                <g id="pile"></g>
                <g transform="translate(-60 -55)">
                  <g id="enzBody">
                    <path d="M0 0 L20.35 -12.72 A24 24 0 1 0 20.35 12.72 Z" fill="#9ff0c8" stroke="#1b6b4a" stroke-width="2"/>
                    <circle cx="3" cy="-12" r="3" fill="#0b1220"/>
                  </g>
                  <text class="t-small" y="44" text-anchor="middle" fill="#cfeee0" stroke="#0b1220" stroke-width="4" paint-order="stroke">enzyme</text>
                  <g id="enzX"><use href="#xbadge"/></g>
                </g>
                <g id="transport">
                  <path id="transPath" d="M100 52 L186 97" fill="none" stroke="#9ff0c8" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" marker-end="url(#arrowHead)"/>
                  <text class="t-small" x="150" y="132" text-anchor="middle" fill="#cfeee0" stroke="#0b1220" stroke-width="4" paint-order="stroke">transport</text>
                  <g transform="translate(143 74.5)"><g id="transX"><use href="#xbadge"/></g></g>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- Overlay text -->
        <text id="title" class="t-title" x="800" y="96" text-anchor="middle" fill="#eef2f8" opacity="0">NIEMANN-PICK DISEASE</text>
        <g id="chip1" opacity="0">
          <rect x="590" y="124" width="420" height="44" rx="22" fill="#241f5c" stroke="#8b7bff" stroke-width="2"/>
          <text class="t-chip" x="800" y="153" text-anchor="middle" fill="#d6cfff">INHERITED METABOLIC DISORDER</text>
        </g>
        <g id="chip2" opacity="0">
          <rect x="600" y="124" width="400" height="44" rx="22" fill="#123b2b" stroke="#46d28c" stroke-width="2"/>
          <text class="t-chip" x="800" y="153" text-anchor="middle" fill="#9ff0c8">LYSOSOMAL STORAGE DISEASE</text>
        </g>
        <g id="legChol" opacity="0" transform="translate(90 858)">
          <use href="#chol" transform="scale(.7)"/>
          <text class="t-lbl" x="48" y="9" fill="#ffd77a">Cholesterol</text>
        </g>
        <g id="legSm" opacity="0" transform="translate(330 852)">
          <use href="#sm" transform="scale(.85)"/>
          <text class="t-lbl" x="26" y="15" fill="#ff9fcb">Sphingomyelin</text>
        </g>
        <g id="buildLbl" opacity="0">
          <path d="M1150 670 L1290 712" stroke="#ff8a5c" stroke-width="3" fill="none"/>
          <circle cx="1150" cy="670" r="6" fill="#ff8a5c"/>
          <text class="t-big" x="1300" y="722" fill="#ff8a5c">Lipids build up</text>
        </g>
      </svg>
      <button class="big-play" id="bigPlay" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l15 8-15 8z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="controls">
      <button id="playBtn" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M6 4l15 8-15 8z" fill="currentColor"/></svg><span class="lbl" id="playLbl">Play</span>
      </button>
      <button id="restartBtn" type="button" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></svg><span class="lbl">Restart</span>
      </button>
      <input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Seek">
      <span id="clock">0.0 / 10.0 s</span>
      <button id="fsBtn" type="button" aria-label="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 0h2v5h-5v-2h3z" fill="currentColor"/></svg><span class="lbl">Full screen</span>
      </button>
    </div>
  </div>

  <section style="display:grid;gap:12px">
    <div class="script-head">
      <h2>Voice-over script</h2>
      <button class="copy" id="copyBtn" type="button">Copy script</button>
    </div>
    <ol class="script" id="script"></ol>
    <p class="hint">Space = play/pause · R = restart · F = full screen (clean frame for screen recording).</p>
  </section>
</div>

<script>
const T = 10, NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

const LINES = [
  { t0: 0,   t1: 2.6, text: 'Niemann-Pick disease is an inherited metabolic disorder —' },
  { t0: 2.6, t1: 4.6, text: 'a lysosomal storage disease.' },
  { t0: 4.6, t1: 7.6, text: 'Cells can’t break down or transport fats like cholesterol and sphingomyelin…' },
  { t0: 7.6, t1: 10,  text: '…so they build up inside cells.' }
];

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Keyframes on the shared 10 s timeline: pts = [[seconds, value], ...]
function timeline(node, tag, attrs, pts, linear) {
  if (typeof node === 'string') node = $(node);
  pts = pts.slice();
  if (pts[0][0] > 0) pts.unshift([0, pts[0][1]]);
  if (pts[pts.length - 1][0] < T) pts.push([T, pts[pts.length - 1][1]]);
  const a = el(tag, Object.assign({
    begin: '0s', dur: T + 's', fill: 'freeze',
    values: pts.map(p => p[1]).join(';'),
    keyTimes: pts.map(p => +(p[0] / T).toFixed(4)).join(';'),
    calcMode: linear ? 'linear' : 'spline'
  }, attrs), node);
  if (!linear) a.setAttribute('keySplines', Array(pts.length - 1).fill('.42 0 .58 1').join(';'));
  return a;
}
const anim = (node, attr, pts, linear) => timeline(node, 'animate', { attributeName: attr }, pts, linear);
const move = (node, type, pts, linear) => timeline(node, 'animateTransform', { attributeName: 'transform', type, additive: 'sum' }, pts, linear);
const pop = (node, t) => move(node, 'scale', [[t, '0.001'], [t + 0.2, '1.25'], [t + 0.35, '1']]);

/* ---------- Scene 1: spinning DNA with one faulty rung ---------- */
const helix = $('helix');
for (let i = 0; i < 15; i++) {
  const bad = i === 9;
  const r = el('g', {}, el('g', { transform: `translate(${(i - 7) * 44} 0)` }, helix));
  el('line', { y1: -100, y2: 100, stroke: bad ? '#ff5a5a' : '#3d5683', 'stroke-width': 6, 'stroke-linecap': 'round' }, r);
  el('circle', { cy: -100, r: 13, fill: bad ? '#ff5a5a' : '#5fb3ff' }, r);
  el('circle', { cy: 100, r: 13, fill: bad ? '#ffb15a' : '#b78cff' }, r);
  const vals = [];
  for (let k = 0; k <= 12; k++) vals.push('1 ' + Math.cos(i * 0.5 + k * Math.PI / 6).toFixed(3));
  el('animateTransform', { attributeName: 'transform', type: 'scale', values: vals.join(';'), dur: '2s', repeatCount: 'indefinite', begin: '0s' }, r);
}
anim('title', 'opacity', [[0, 0], [0.4, 1]]);
anim('chip1', 'opacity', [[0.3, 0], [0.7, 1], [2.3, 1], [2.6, 0]]);
anim('s1', 'opacity', [[0, 0], [0.35, 1], [2.2, 1], [2.75, 0]]);
move('s1', 'scale', [[0, '0.9'], [0.5, '1'], [2.15, '1'], [2.75, '2.2']]);
anim('faultyLbl', 'opacity', [[0.6, 0], [1.0, 1]]);

/* ---------- Scene 2: zoom into the cell, highlight lysosome ---------- */
anim('cell', 'opacity', [[2.45, 0], [3.0, 1]]);
move('cell', 'scale', [[2.5, '0.55'], [3.2, '1'], [7.7, '1'], [9.6, '1.06']]);
anim('chip2', 'opacity', [[2.7, 0], [3.1, 1]]);
anim('lysoLbl', 'opacity', [[3.0, 0], [3.4, 1]]);
anim('lysoGlow', 'opacity', [[2.9, 0], [3.3, 0.95], [3.7, 0.25], [4.1, 0.95], [4.6, 0]]);

// Enzyme "chomps" until it is shown as defective
const chomp = [];
for (let t = 2.5, k = 0; t <= 6.0; t += 0.25, k++) chomp.push([t, k % 2 ? -16 : 0]);
move('enzBody', 'rotate', chomp);

/* ---------- Scene 3: lipids arrive, enzyme + transport blocked ---------- */
const N = 28, R = 84, pos = [];
for (let i = 0; i < N; i++) {
  const rr = R * Math.sqrt((i + 0.5) / N), a = i * 2.39996;
  pos.push([rr * Math.cos(a), rr * Math.sin(a)]);
}
function lipid(parent, i) {
  const chol = i % 2 === 0;
  const o = el('g', { transform: `translate(${pos[i][0].toFixed(1)} ${pos[i][1].toFixed(1)})` }, parent);
  const m = el('g', {}, o);
  const rot = chol ? (i * 67) % 180 - 90 : (i * 41) % 60 - 30;
  el('use', { href: chol ? '#chol' : '#sm' }, el('g', { transform: `rotate(${rot}) scale(${chol ? 0.55 : 0.7})` }, m));
  return m;
}
// Start points are off-stage, expressed in lysosome-local coordinates (lysosome sits at 1020,540 on stage)
const STARTS = [[-1080, -300], [-1080, 20], [-720, 420], [640, -390], [640, 160], [-1080, -580]];
STARTS.forEach(([dx, dy], j) => {
  const m = lipid($('flyins'), j), s = 4.7 + j * 0.2;
  anim(m, 'opacity', [[s, 0], [s + 0.15, 1]]);
  move(m, 'translate', [[s, `${dx - pos[j][0]} ${dy - pos[j][1]}`], [s + 1.0, '0 0']]);
});
anim('legChol', 'opacity', [[4.9, 0], [5.3, 1]]);
anim('legSm', 'opacity', [[5.2, 0], [5.6, 1]]);

anim('enzBody', 'opacity', [[5.95, 1], [6.25, 0.4]]);
pop('enzX', 6.0);
anim('transPath', 'stroke-dashoffset', [[0, 0], [6.4, -288]], true);
anim('transPath', 'opacity', [[6.4, 1], [6.7, 0.35]]);
pop('transX', 6.4);
anim('transport', 'opacity', [[7.4, 1], [7.9, 0]]);

/* ---------- Scene 4: build-up, lysosomes and cell swell ---------- */
for (let i = 6; i < N; i++) pop(lipid($('pile'), i), 7.5 + (i - 6) * 0.075);
move('lyso', 'scale', [[7.5, '1'], [9.3, '1.45']]);
anim('lysoMem', 'stroke', [[7.6, '#46d28c'], [9.2, '#ff8a5c']]);

function smallLyso(x, y, r, t) {
  const g = el('g', {}, el('g', { transform: `translate(${x} ${y})` }, $('smallLysos')));
  const mem = el('circle', { r, fill: 'url(#lysoFill)', stroke: '#46d28c', 'stroke-width': 3 }, g);
  const dots = el('g', { opacity: 0 }, g);
  for (let k = 0; k < 6; k++) {
    const a = k * 2.4, rr = r * 0.55 * Math.sqrt((k + 0.5) / 6);
    el('circle', { cx: (rr * Math.cos(a)).toFixed(1), cy: (rr * Math.sin(a)).toFixed(1), r: (r * 0.2).toFixed(1), fill: k % 2 ? '#ff7ab6' : '#ffc43c' }, dots);
  }
  anim(dots, 'opacity', [[t, 0], [t + 0.6, 1]]);
  move(g, 'scale', [[t, '1'], [t + 1.2, '1.35']]);
  anim(mem, 'stroke', [[t, '#46d28c'], [t + 1.2, '#ff8a5c']]);
}
smallLyso(20, -180, 40, 8.0);
smallLyso(60, 215, 36, 8.3);

anim('buildLbl', 'opacity', [[8.4, 0], [8.8, 1]]);
anim('cellAlarm', 'opacity', [[8.3, 0], [8.8, 0.85], [9.3, 0.35], [9.8, 0.85]]);

/* ---------- Player ---------- */
const svg = $('anim'), stage = $('stage'), big = $('bigPlay'), scrub = $('scrub'), clock = $('clock');
const items = LINES.map(l => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<time>${l.t0.toFixed(1)}–${l.t1.toFixed(1)} s</time><span>${l.text}</span>`;
  b.addEventListener('click', () => seek(l.t0));
  li.appendChild(b);
  $('script').appendChild(li);
  return b;
});

svg.pauseAnimations();
svg.setCurrentTime(0);
let playing = false, raf = 0;
const cur = () => Math.min(T, Math.max(0, svg.getCurrentTime()));

function paint() {
  const t = cur();
  scrub.value = t;
  clock.textContent = t.toFixed(1) + ' / 10.0 s';
  items.forEach((b, i) => b.classList.toggle('on', t >= LINES[i].t0 && (t < LINES[i].t1 || i === LINES.length - 1)));
  big.hidden = playing || (t > 0.001 && t < T - 0.001);
  $('playIcon').setAttribute('d', playing ? 'M6 4h4v16H6zm8 0h4v16h-4z' : 'M6 4l15 8-15 8z');
  $('playLbl').textContent = playing ? 'Pause' : 'Play';
  $('playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function tick() {
  if (svg.getCurrentTime() >= T) { svg.setCurrentTime(T); pause(); return; }
  paint();
  raf = requestAnimationFrame(tick);
}
function play() {
  if (cur() >= T - 0.02) svg.setCurrentTime(0);
  svg.unpauseAnimations();
  playing = true;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
  paint();
}
function pause() {
  svg.pauseAnimations();
  playing = false;
  cancelAnimationFrame(raf);
  paint();
}
function seek(t) { svg.setCurrentTime(t); paint(); }
function toggle() { playing ? pause() : play(); }
function restart() { seek(0); play(); }
function toggleFs() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) req.call(stage);
  }
}

big.addEventListener('click', e => { e.stopPropagation(); play(); });
stage.addEventListener('click', toggle);
$('playBtn').addEventListener('click', toggle);
$('restartBtn').addEventListener('click', restart);
$('fsBtn').addEventListener('click', toggleFs);
scrub.addEventListener('input', () => { if (playing) pause(); seek(+scrub.value); });
$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(LINES.map(l => l.text).join(' '));
    $('copyBtn').textContent = 'Copied';
  } catch (err) {
    $('copyBtn').textContent = 'Copy failed';
  }
  setTimeout(() => { $('copyBtn').textContent = 'Copy script'; }, 1500);
});
document.addEventListener('keydown', e => {
  const inControl = e.target.closest && e.target.closest('button, input');
  if (e.code === 'Space') {
    if (inControl) return;
    e.preventDefault();
    toggle();
  } else if (e.key === 'r' || e.key === 'R') {
    restart();
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFs();
  }
});

paint();
</script>
</body>
</html>
