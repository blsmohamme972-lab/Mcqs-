plugins { id "com.android.application" }

android {
    namespace "com.onemoremcqs.abgreader"
    compileSdk 34
    defaultConfig {
        applicationId "com.onemoremcqs.abgreader"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.5-mlkit"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The page and Tesseract files are copied in by prepare_assets.sh.
    androidResources { noCompress += ["wasm", "js"] }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.13.1"
    // On-device text recognition (Latin script), model bundled in the APK — no network needed.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Align old kotlin-stdlib-jdk7/jdk8 pulled in transitively with the newer kotlin-stdlib.
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}
