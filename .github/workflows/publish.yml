# Every push builds the app and the content packages and publishes them as a GitHub release.
# The app checks releases/latest/download/index.json on start and pulls whatever changed.
name: Build & publish

on:
  push:
    branches: [master, ccr-56cc3122-ubuyzv]
    paths: ["android/**", "apk/**", "content/**", "examiner/bank/**", "tools/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      TAG: v0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build app
        working-directory: android
        env:
          MCQS_KEYSTORE_B64: ${{ secrets.MCQS_KEYSTORE_B64 }}
          MCQS_KEYSTORE_PASSWORD: ${{ secrets.MCQS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../dist
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -z "$MCQS_KEYSTORE_B64" ] || [ -z "$MCQS_KEYSTORE_PASSWORD" ]; then
            # No signing secrets (the owner's choice for now): the app update is the APK Claude Code built and signed
            # with the same key, committed as apk/MCQs.apk with its version in apk/MCQs.json.
            ./gradlew --no-daemon testDebugUnitTest
            if [ -f ../apk/MCQs.apk ]; then
              cp ../apk/MCQs.apk ../dist/MCQs.apk
              echo "APP_VERSION_CODE=$(python3 -c 'import json; print(json.load(open("../apk/MCQs.json"))["versionCode"])')" >> "$GITHUB_ENV"
              echo "APP_VERSION_NAME=$(python3 -c 'import json; print(json.load(open("../apk/MCQs.json"))["versionName"])')" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          # Secrets set: CI signs; +100 keeps its versions above the committed APK's (0.2.30).
          export BUILD_NUMBER=$((BUILD_NUMBER + 100))
          echo "APP_VERSION_CODE=$((100 + BUILD_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=0.2.$BUILD_NUMBER" >> "$GITHUB_ENV"
          export MCQS_KEYSTORE_PATH="$RUNNER_TEMP/mcqs.jks"
          echo "$MCQS_KEYSTORE_B64" | base64 -d > "$MCQS_KEYSTORE_PATH"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/MCQs.apk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build content packages (content/ and the viva decks made from examiner/bank)
        run: |
          shopt -s nullglob
          pip install -q fsrs==6.3.2 pdfplumber==0.11.10
          # Figures only with an app update in the same release: older apps show a basic card's picture before the
          # answer, and the book's labelled figures would give answers away.
          python3 tools/examiner.py appdeck "$RUNNER_TEMP/viva" $([ -f dist/MCQs.apk ] && echo --figures)
          for d in content/*/ "$RUNNER_TEMP"/viva/*/; do
            python3 tools/build_package.py "$d" "dist/$(basename "$d").zip"
          done

      - name: Write index.json
        run: |
          python3 tools/make_index.py dist \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            "${APP_VERSION_CODE:-0}" "${APP_VERSION_NAME:-none}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "MCQs $TAG" \
            --notes "Built from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}: $COMMIT_MSG"

      - name: Keep only the 10 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
            xargs -r -I{} gh release delete {} --yes --cleanup-tag
