# Every push builds the app and the content packages and publishes them as a GitHub release.
# The app checks releases/latest/download/index.json on start and pulls whatever changed.
name: Build & publish

on:
  push:
    branches: [master, ccr-56cc3122-ubuyzv]
    paths: ["android/**", "content/**", "examiner/bank/**", "tools/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      TAG: v0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build app
        working-directory: android
        env:
          MCQS_KEYSTORE_B64: ${{ secrets.MCQS_KEYSTORE_B64 }}
          MCQS_KEYSTORE_PASSWORD: ${{ secrets.MCQS_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../dist
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -z "$MCQS_KEYSTORE_B64" ] || [ -z "$MCQS_KEYSTORE_PASSWORD" ]; then
            # Without the key no installable update can be signed, but the content (decks) still goes out.
            echo "::warning::No app update in this release: add the MCQS_KEYSTORE_B64 and MCQS_KEYSTORE_PASSWORD repository secrets (Settings → Secrets and variables → Actions)."
            ./gradlew --no-daemon testDebugUnitTest
            exit 0
          fi
          export MCQS_KEYSTORE_PATH="$RUNNER_TEMP/mcqs.jks"
          echo "$MCQS_KEYSTORE_B64" | base64 -d > "$MCQS_KEYSTORE_PATH"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/MCQs.apk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build content packages (content/ and the viva decks made from examiner/bank)
        run: |
          shopt -s nullglob
          pip install -q fsrs==6.3.2
          python3 tools/examiner.py appdeck "$RUNNER_TEMP/viva"
          for d in content/*/ "$RUNNER_TEMP"/viva/*/; do
            python3 tools/build_package.py "$d" "dist/$(basename "$d").zip"
          done

      - name: Write index.json
        run: |
          python3 tools/make_index.py dist \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            "$((100 + BUILD_NUMBER))" "0.2.$BUILD_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "MCQs $TAG" \
            --notes "Built from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}: $COMMIT_MSG"

      - name: Keep only the 10 newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' |
            xargs -r -I{} gh release delete {} --yes --cleanup-tag
