<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one clinical "monitor" stage, transport bar under it, timed script below. Single dark look by design. */
:root {
  --bg: #0b1220;
  --stage: #0e1626;
  --panel: #182339;
  --line: #2a3754;
  --fg: #eef2f8;
  --muted: #95a3bd;
  --accent: #ffc43c;
  --danger: #ff5a5a;
  --ok: #46d28c;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.tag { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.player { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; }
canvas { display: block; width: 100%; height: 100%; }
.big-play { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; display: grid; place-items: center; box-shadow: 0 8px 30px rgb(0 0 0 / 0.45); }
.big-play svg { width: 34px; height: 34px; margin-left: 5px; }
.big-play:focus-visible, .controls button:focus-visible, .controls input:focus-visible, .script button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.controls { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
.controls button { flex: none; height: 36px; min-width: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--stage); color: var(--fg); font: 600 14px var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.controls button:hover { border-color: var(--muted); }
.controls svg { width: 16px; height: 16px; }
#scrub { flex: 1; min-width: 0; accent-color: var(--accent); }
#clock { font: 500 14px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
.script { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.script button { width: 100%; height: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.script button:hover { border-color: var(--muted); }
.script button.on { border-color: var(--accent); }
.script time { font: 500 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.script q { quotes: none; font-weight: 600; }
.script small { color: var(--muted); font-size: 14px; }
.note { color: var(--muted); font-size: 14px; max-width: 65ch; margin: 0; }
@media (max-width: 520px) { .controls .lbl { display: none; } .big-play { width: 64px; height: 64px; } .big-play svg { width: 26px; height: 26px; } }
</style>

<div class="wrap">
  <header>
    <h1>Compartment <span>Syndrome</span></h1>
    <div class="tag">8-second explainer · voice-over</div>
  </header>

  <div class="player">
    <div class="stage">
      <canvas id="cv" width="1280" height="720" aria-label="Animated cross-section of the leg showing compartment syndrome"></canvas>
      <button class="big-play" id="bigPlay" aria-label="Play with voice-over">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>
      </button>
    </div>
    <div class="controls">
      <button id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M6 4l15 8-15 8z"/></svg><span class="lbl" id="playLbl">Play</span></button>
      <button id="restart" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg><span class="lbl">Restart</span></button>
      <input type="range" id="scrub" min="0" max="8" step="0.01" value="0.9" aria-label="Seek">
      <span id="clock">0.9 / 8.0 s</span>
    </div>
  </div>

  <ol class="script" id="script"></ol>
  <p class="note">Teaching diagram, not to scale. The red zone on the gauge marks compartment pressure above 30 mmHg; some sources use a delta pressure (diastolic minus compartment pressure) under 30 mmHg instead.</p>
</div>

  line([[x0, y0], [x1, y1]], col, w);
  const a = Math.atan2(y1 - y0, x1 - x0);
  poly([[x1, y1], [x1 - head * Math.cos(a - .45), y1 - head * Math.sin(a - .45)],
        [x1 - head * Math.cos(a + .45), y1 - head * Math.sin(a + .45)]], col);
}
function ellPts(cx, cy, rx, ry, a0, a1, n = 90) {
  const out = [];
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
  return out;
}

// simplified transverse section of the mid-leg
const ANT = [520, 300, 78, 62], LAT = [668, 400, 44, 68], DEEP = [470, 440, 120, 40], SUP = [465, 530, 175, 58];

function muscleBlob(comp, col, grow = 1) {
  const [cx, cy, rx, ry] = comp;
  ell(cx, cy, rx * grow, ry * grow, col);
  const fib = mix(col, [0, 0, 0], .25);
  for (let i = -3; i <= 3; i++) for (let j = -2; j <= 2; j++) {
    const x = cx + i * rx * .26 * grow, y = cy + j * ry * .33 * grow;
    if (((x - cx) / (rx * grow)) ** 2 + ((y - cy) / (ry * grow)) ** 2 < .7) ell(x, y, 3, 3, fib);
  }
}

function crossSection(swell = 0, open = 0, labels = 1, pulse = 0) {
  ell(470, 405, 255, 215, SKIN);
  ell(470, 405, 238, 198, SUBQ);
  if (open > 0) {
    const g = .22 * open;
    poly([...ellPts(470, 405, 256, 216, -62 - g * 40, -62 + g * 40, 20), [560, 290]], [150, 30, 40]);
  }
  for (const c of [SUP, DEEP, LAT]) { muscleBlob(c, MUSCLE); ell(...c, null, FASCIA, 3); }
  const antCol = mix(MUSCLE, [165, 30, 45], swell * (1 - open));
  const grow = open > 0 ? 1 + .12 * open : .86 + .14 * swell;
  const [cx, cy, rx, ry] = ANT, shift = 10 * open;
  muscleBlob([cx + shift * .5, cy - shift, rx, ry], antCol, grow);
  const vsq = clamp(swell * 1.6 - .2) * (1 - open);
  ell(505, 352, 9, 9 * (1 - .75 * vsq), VEIN);
  ell(525, 352, 8, 8 * (1 - .45 * clamp(vsq * 1.3 - .4)), ARTERY);
  const fw = 3 + 3 * swell * (1 - open) + 2 * pulse;
  const fcol = mix(FASCIA, ACCENT, swell * (1 - open));
  if (open <= 0) ell(...ANT, null, fcol, fw);
  else { const gap = 70 * open; line(ellPts(cx, cy, rx, ry, -60 + gap / 2, 300 - gap / 2), fcol, fw); }
  line([[430, 345], [650, 395]], [220, 220, 230], 3);
  ell(405, 320, 58, 52, BONE); ell(405, 322, 30, 26, MARROW);
  ell(640, 398, 24, 24, BONE); ell(640, 398, 10, 10, MARROW);
  if (labels > 0) {
    const lc = mix(BG, WHITE, labels);
    text(405, 320, "Tibia", 14, mix(BG, [90, 70, 40], labels), "Bold", "mm");
    text(520, 296, "Anterior", 15, lc, "Bold", "mm");
    text(668, 446, "Lat.", 15, lc, "Bold", "mm");
    text(470, 442, "Deep posterior", 15, lc, "Bold", "mm");
    text(465, 540, "Superficial posterior", 15, lc, "Bold", "mm");
  }
  if (swell > .15 && open < .5) {
    const k = clamp((swell - .15) / .5) * (1 - 2 * open), col = mix(BG, DANGER, k);
    for (const ang of [200, 250, 300, 340, 20]) {
      const a = ang * Math.PI / 180;
      arrow(cx + (rx + 30) * Math.cos(a), cy + (ry + 30) * Math.sin(a), cx + (rx + 6) * Math.cos(a), cy + (ry + 6) * Math.sin(a), col, 4, 11);
    }
  }
}

function gauge(value, t) {
  const cx = 1020, cy = 250, r = 112;
  ell(cx, cy, r + 22, r + 22, PANEL);
  const pt = (v, rr) => { const th = (225 - 270 * v / 60) * Math.PI / 180; return [cx + rr * Math.cos(th), cy - rr * Math.sin(th)]; };
  const arc = (a, b) => { const o = []; for (let v = a; v <= b; v += .5) o.push(pt(v, r)); return o; };
  line(arc(0, 30), [70, 85, 115], 14);
  line(arc(30, 60), [150, 45, 55], 14);
  for (let v = 0; v <= 60; v += 10) { line([pt(v, r - 14), pt(v, r - 24)], MUTED, 3); text(...pt(v, r - 40), String(v), 14, MUTED, "Medium", "mm"); }
  const col = value >= 30 ? DANGER : OK;
  line([[cx, cy], pt(value, r - 18)], col, 6);
  ell(cx, cy, 10, 10, col);
  mono(cx, cy + r + 52, `${Math.round(value)} mmHg`, 30, col);
  text(cx, cy + r + 82, "compartment pressure", 15, MUTED, "Medium", "mm");
  if (value >= 30 && Math.floor(t * 4) % 2 === 0) text(cx, cy - 34, "> 30", 18, DANGER, "Bold", "mm");
}

function captionPanel(title, body, k, color = WHITE) {
  if (k <= 0) return;
  const y = 470 + 18 * (1 - k);
  text(820, y, title, 28, mix(BG, color, k));
  body.forEach((l, i) => text(820, y + 44 + i * 28, l, 19, mix(BG, MUTED, k), "Medium"));
}

function subtitle(s, k) {
  if (!s || k <= 0) return;
  ctx.font = `600 22px Barlow, "Helvetica Neue", Arial, sans-serif`;
  const tw = ctx.measureText(s).width;
  rrect(640 - tw / 2 - 18, 660, 640 + tw / 2 + 18, 700, 10, mix(BG, [0, 0, 0], .6 * k));
  text(640, 681, s, 22, mix(BG, WHITE, k), "SemiBold", "mm");
}

function zoomView(k, t) {
  rrect(90, 150, 760, 590, 28, PANEL, ACCENT, 6);
  const musc = mix(MUSCLE, MUSCLE_DARK, seg(k, .45, 1));
  for (let row = 0; row < 5; row++) {
    rrect(130, 185 + row * 26, 720, 201 + row * 26, 8, musc);
    rrect(130, 455 + row * 26, 720, 471 + row * 26, 8, musc);
  }
  const veinH = 26 * (1 - .85 * seg(k, 0, .4)), artH = 22 * (1 - .7 * seg(k, .35, .8)), vy = 340, ay = 405;
  rrect(110, vy - veinH, 740, vy + veinH, veinH, VEIN);
  rrect(110, ay - artH, 740, ay + artH, artH, ARTERY);
  const flow = 1 - seg(k, .3, .9);
  for (let i = 0; i < 9; i++) { const x = 120 + ((i * 72 + t * 260 * flow) % 610); ell(x, ay, 8 * artH / 22, 5 * artH / 22, [255, 150, 150]); }
  text(130, vy, "vein", 18, WHITE, "Bold", "lm");
  text(130, ay, "artery", 18, WHITE, "Bold", "lm");
  for (const x of [230, 425, 620]) { arrow(x, 160, x, 182, DANGER, 5, 12); arrow(x, 580, x, 558, DANGER, 5, 12); }
  if (k > .6) {
    const a = seg(k, .6, .85);
    rrect(330, 352, 520, 393, 12, mix(PANEL, [10, 10, 20], a));
    text(425, 373, "ISCHEMIA", 26, mix(PANEL, ACCENT, a), "Bold", "mm");
  }
}

function legSide(k, t) {
  rrect(330, 140, 440, 470, 45, SKIN);
  const sw = .5 + .5 * Math.sin(t * 12);
  ell(408, 300, 26, 95, mix(MUSCLE, [170, 25, 40], .6 + .4 * sw));
  text(470, 160, "anterior compartment", 16, MUTED, "Medium");
  line([[468, 168], [420, 220]], MUTED, 2);
  const ang = 32 * seg(k, .1, .6) * Math.PI / 180, ax = 385, ay = 455;
  const foot = [[-55, -15], [55, -10], [130, 5], [165, 20], [168, 38], [-50, 45], [-62, 20]];
  const pts = foot.map(([x, y]) => [ax + x * Math.cos(ang) - y * Math.sin(ang), ay + x * Math.sin(ang) + y * Math.cos(ang)]);
  poly(pts, SKIN);
  const [tx, ty] = pts[3];
  arrow(tx + 60, ty - 70, tx + 12, ty - 10, ACCENT, 6, 16);
  text(tx + 66, ty - 92, "passive stretch", 18, ACCENT);
  if (k > .35) {
    const r = 34 + 8 * sw, star = [];
    for (let i = 0; i < 16; i++) { const rr = i % 2 === 0 ? r : r * .5; star.push([500 + rr * Math.cos(i * Math.PI / 8), 290 + rr * Math.sin(i * Math.PI / 8)]); }
    poly(star, DANGER);
    text(500, 290, "!", 30, WHITE, "Bold", "mm");
    text(500, 345, "PAIN", 20, DANGER, "Bold", "mm");
  }
}

function pressureAt(t) {
  if (t < 1.15) return 8;
  if (t < 3.7) return 8 + 40 * seg(t, 1.4, 3.4);
  if (t < 6.7) return 48 + 3 * Math.sin(t * 9);
  return 48 - 38 * seg(t, 6.9, 7.7);
}

function scene(t) {
  ctx.fillStyle = css(BG); ctx.fillRect(0, 0, W, H);
  if (t < 3.7) {
    const sc = .88 + .12 * seg(t, 0, .5), swell = seg(t, 1.4, 3.3);
    ctx.save(); ctx.translate(470 * (1 - sc), 405 * (1 - sc)); ctx.scale(sc, sc);
    crossSection(swell, 0, seg(t, .3, .8), swell > .5 ? .5 + .5 * Math.sin(t * 14) : 0);
    ctx.restore();
  } else if (t < 5.6) zoomView(seg(t, 3.75, 5.4), t);
  else if (t < 6.75) legSide(seg(t, 5.6, 6.6), t);
  else {
    const k = seg(t, 6.85, 7.6);
    crossSection(1, k, 0);
    if (k < 1) for (let i = 0; i < 6; i += 2) {
      const a = (-95 + i * 9) * Math.PI / 180;
      line([[470 + 270 * Math.cos(a), 405 + 232 * Math.sin(a)], [470 + 270 * Math.cos(a + .12), 405 + 232 * Math.sin(a + .12)]], mix(BG, ACCENT, 1 - k), 4);
    }
  }
  gauge(pressureAt(t), t);
  if (t < 1.15) {
    const k = seg(t, .05, .45);
    text(820, 470 + 16 * (1 - k), "Compartment", 44, mix(BG, WHITE, k));
    text(820, 522 + 16 * (1 - k), "Syndrome", 44, mix(BG, ACCENT, k));
    text(820, 585, "Cross-section of the mid-leg", 18, mix(BG, MUTED, k), "Medium");
  } else if (t < 3.7) captionPanel("Pressure builds", ["Fracture, crush or tight cast →", "swelling inside fascia that", "cannot stretch"], seg(t, 1.2, 1.6));
  else if (t < 5.6) captionPanel("Perfusion fails", ["1. Veins collapse first", "2. Then arterioles", "3. Muscle & nerve ischemia"], seg(t, 3.75, 4.1), DANGER);
  else if (t < 6.75) captionPanel("Earliest sign", ["Pain out of proportion,", "worse on passive stretch.", "Pulses often still present!"], seg(t, 5.65, 5.95), ACCENT);
  else captionPanel("Treatment", ["Urgent fasciotomy", "Split fascia → pressure falls", "→ perfusion restored"], seg(t, 6.8, 7.1), OK);
  VO.forEach(([s, start], i) => {
    const last = i === VO.length - 1, end = last ? DUR : VO[i + 1][1];
    if (t >= start && t < end) subtitle(s, last ? seg(t, start, start + .15) : seg(t, start, start + .15) * (1 - seg(t, end - .1, end)));
  });
  ctx.fillStyle = css(ACCENT); ctx.fillRect(0, H - 5, W * t / DUR, 5);
}

function draw(t) {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  for (const b of [1.15, 3.7, 5.6, 6.75]) {
    if (t >= b - .12 && t < b + .12) {
      scene(Math.min(t, b - .001));
      ctx.globalAlpha = (t - (b - .12)) / .24;
      scene(Math.max(t, b));
      ctx.globalAlpha = 1;
      return;
    }
  }
  scene(t);
}

// ---------------- player
const audio = document.getElementById("vo");
const playBtn = document.getElementById("play"), bigPlay = document.getElementById("bigPlay");
const playIcon = document.getElementById("playIcon"), playLbl = document.getElementById("playLbl");
const scrub = document.getElementById("scrub"), clock = document.getElementById("clock");
const list = document.getElementById("script");
let t = 0.9, playing = false, started = false, last = 0;

VO.forEach(([s, start, note], i) => {
  const li = document.createElement("li");
  li.innerHTML = `<button type="button"><time>${start.toFixed(1)} s</time><q></q><small></small></button>`;
  li.querySelector("q").textContent = s;
  li.querySelector("small").textContent = note;
  li.querySelector("button").addEventListener("click", () => { seek(Math.max(0, start - .1)); if (!playing) play(); });
  list.appendChild(li);
});
const items = [...list.querySelectorAll("button")];

function ui() {
  scrub.value = t.toFixed(2);
  clock.textContent = `${t.toFixed(1)} / ${DUR.toFixed(1)} s`;
  playIcon.innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M6 4l15 8-15 8z"/>';
  playLbl.textContent = playing ? "Pause" : (t >= DUR - .01 ? "Replay" : "Play");
  playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
  bigPlay.hidden = playing || (started && t < DUR - .01);
  let cur = 0; VO.forEach(([, s], i) => { if (t >= s) cur = i; });
  items.forEach((b, i) => b.classList.toggle("on", i === cur && started));
}
function seek(v) {
  t = clamp(v, 0, DUR);
  try { audio.currentTime = Math.min(t, (audio.duration || DUR) - .01); } catch (e) {}
  draw(t); ui();
}
function play() {
  if (!started || t >= DUR - .01) { started = true; seek(0); }
  playing = true; last = performance.now();
  audio.play().catch(() => {});
  ui(); requestAnimationFrame(tick);
}
function pause() { playing = false; audio.pause(); ui(); }
function tick(now) {
  if (!playing) return;
  // follow the audio clock when it runs; otherwise advance on wall time
  if (!audio.paused && !audio.ended && audio.currentTime > 0) t = audio.currentTime;
  else t += (now - last) / 1000;
  last = now;
  if (t >= DUR) { t = DUR; draw(t); pause(); return; }
  draw(t); ui();
  requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => playing ? pause() : play());
bigPlay.addEventListener("click", play);
document.getElementById("restart").addEventListener("click", () => { started = true; seek(0); play(); });
scrub.addEventListener("input", () => { started = true; if (playing) pause(); seek(parseFloat(scrub.value)); });
window.addEventListener("resize", () => { fit(); draw(t); });

fit(); draw(t); ui();
Promise.all(["700 20px Barlow", "600 20px Barlow", "500 20px Barlow", '500 20px "IBM Plex Mono"'].map(f => document.fonts.load(f)))
  .catch(() => {}).then(() => draw(t));
})();
</script>
