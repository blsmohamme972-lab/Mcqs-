<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>Gas exchange in the alveolus</title><style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#eef2f7}
body{font-family:Inter,"Liberation Sans",sans-serif;color:#13203a;-webkit-font-smoothing:antialiased}
#root{position:relative;width:1280px;height:720px;background:radial-gradient(1200px 700px at 80% 0%,#ffffff 0%,#eef2f7 60%,#e6ebf3 100%)}
.stage{position:absolute;left:36px;top:40px;width:640px;height:640px;background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(19,32,58,.06),0 12px 40px rgba(19,32,58,.10);overflow:hidden}
.stage-inner{position:absolute;inset:0;overflow:hidden}
.space{position:absolute;left:0;top:0;width:900px;height:900px;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;width:900px;height:900px;object-fit:contain}
.overlay{position:absolute;left:0;top:0;width:900px;height:900px;overflow:visible}
.badge{position:absolute;right:14px;top:14px;font:700 13px Inter;color:#fff;background:var(--accent);padding:5px 10px;border-radius:999px;letter-spacing:.04em}
.panel{position:absolute;left:712px;top:40px;width:532px;height:640px;display:flex;flex-direction:column}
.kicker{font:700 13px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:800 34px/1.12 "Inter Display",Inter;letter-spacing:-.01em;margin:8px 0 18px;color:#0e1a33}
.steps{list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-radius:12px;font:500 16.5px/1.38 Inter;color:#22304d;transition:none;border:1.5px solid transparent}
.steps li .n{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px Inter;background:#dde4ef;color:#4a5878;margin-top:-1px}
.steps li.on{background:#fff;border-color:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 6px 18px rgba(19,32,58,.08)}
.steps li.on .n{background:var(--accent);color:#fff}
.steps b{color:#0e1a33}
.widget{margin-top:14px}
.take{margin-top:auto;padding:12px 16px;border-radius:14px;background:#0e1a33;color:#e9eef8;font:500 15.5px/1.4 Inter}
.take b{display:block;font:700 11.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 55%,#fff);margin-bottom:3px}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(19,32,58,.08)}
.bar i{display:block;height:100%;background:var(--accent)}
/* widget pieces */
.wcard{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 1px 2px rgba(19,32,58,.06),0 6px 20px rgba(19,32,58,.06)}
.wtitle{font:700 11.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:#6b7896;margin-bottom:6px}
.meter{display:flex;align-items:center;gap:10px;font:600 14px Inter;color:#22304d;margin:5px 0}
.meter .lab{flex:0 0 118px}
.meter .trk{flex:1;height:12px;border-radius:6px;background:#e7ecf4;overflow:hidden}
.meter .trk i{display:block;height:100%;border-radius:6px}
.meter .val{flex:0 0 92px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px}
.chip{font:700 12.5px Inter;letter-spacing:.06em;padding:6px 12px;border-radius:999px;background:#e7ecf4;color:#6b7896}
.chip.on{background:var(--accent);color:#fff}

  num: 4, system: 'Respiratory', color: '#3b6fd8',
  title: 'Gas exchange in the alveolus',
  layers: { gx: '02_Respiratory/gas-exchange-pulmonary.svg' },
  steps: [
    { t0: 0.2, t1: 1.6, text: '<b>Deoxygenated blood</b> enters the capillary: PO₂ 40, PCO₂ 46 mmHg.' },
    { t0: 1.6, t1: 3.8, text: '<b>O₂ diffuses</b> from alveolar air (PO₂ 100) into blood — down its partial-pressure gradient.' },
    { t0: 3.8, t1: 5.8, text: '<b>CO₂ diffuses</b> the opposite way, from blood (46) into the alveolus (40).' },
    { t0: 5.8, t1: 8.0, text: 'Blood leaves <b>oxygenated</b> — equilibrium in ~0.25 s of the 0.75 s transit time.' },
  ],
  widget: `<div class="wcard"><div class="wtitle">Capillary blood (mmHg)</div>
    <div class="meter"><span class="lab">PO₂</span><span class="trk"><i id="mO" style="background:#d62839"></i></span><span class="val" id="vO"></span></div>
    <div class="meter"><span class="lab">PCO₂</span><span class="trk"><i id="mC" style="background:#7a3fa0"></i></span><span class="val" id="vC"></span></div>
    <div style="font:500 12.5px Inter;color:#6b7896;margin-top:6px">Alveolar air: PO₂ 100 · PCO₂ 40 mmHg</div></div>`,
  takeaway: { t: 6.4, text: "Fick's law: diffusion ∝ area × gradient ÷ thickness. Fibrosis (thick membrane) and emphysema (lost area) both impair exchange." },

  init(c) {
    const o = c.o;
    // blood flows from the blue (bottom) end to the red (top / right) ends
    this.v1 = c.path([[370, 760], [300, 660], [215, 560], [270, 480], [400, 425], [600, 385], [905, 325]], {}, o);
    this.v2 = c.path([[620, 760], [600, 620], [560, 480], [480, 420], [400, 330], [330, 230], [305, 150]], {}, o);
    this.v3 = c.path([[0, 520], [150, 485], [300, 430], [460, 395], [650, 360], [905, 305]], {}, o);
    this.cells = [];
    for (const p of [this.v1, this.v2, this.v3]) for (let i = 0; i < 5; i++) this.cells.push({ p, k: i / 5, e: c.el('ellipse', { rx: 20, ry: 13, 'stroke-width': 4, stroke: '#fff' }, o) });
    // molecules along the drawn arrows
    const mol = (txt, col) => { const g = c.el('g', {}, o); c.el('circle', { r: 21, fill: col, stroke: '#fff', 'stroke-width': 3 }, g); const t = c.el('text', { y: 7, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: '#fff', 'font-family': 'Inter' }, g); t.textContent = txt; return g; };
    this.o2p = [c.path([[440, 530], [330, 605], [170, 590]], {}, o), c.path([[820, 590], [620, 610], [530, 465]], {}, o)]; // alveolus → blood
    this.co2p = [c.path([[330, 372], [170, 360], [55, 215]], {}, o), c.path([[400, 360], [480, 245], [710, 262]], {}, o)];
    this.o2 = []; this.co2 = [];
    this.o2p.forEach(p => { for (let i = 0; i < 3; i++) this.o2.push({ p, k: i / 3, g: mol('O₂', '#1f9bd7') }); });
    this.co2p.forEach(p => { for (let i = 0; i < 3; i++) this.co2.push({ p, k: i / 3, g: mol('CO₂', '#7a3fa0') }); });
    this.lA = c.label(720, 110, 'Alveolar wall', { lx: 800, ly: 210, color: '#b0306a' });
    this.lC = c.label(330, 815, 'Capillary blood', { lx: 370, ly: 730, color: '#3b4cc0' });
  },

  update(t, c) {
    const flowPh = 0.11 * t;
    this.cells.forEach(o => {
      const u = c.frac(flowPh + o.k); const [x, y] = c.at(o.p, u);
      c.set(o.e, { cx: x, cy: y, fill: c.mix('#3c4fc9', '#e0323c', c.clamp(u * 1.6)), opacity: Math.min(1, u * 8, (1 - u) * 8) });
    });
    const run = (arr, a, speed) => arr.forEach(m => {
      const u = c.frac((t - a) * speed + m.k); const [x, y] = c.at(m.p, u);
      m.g.setAttribute('transform', `translate(${x},${y})`);
      m.g.setAttribute('opacity', c.seg(t, a, a + .3) * Math.min(1, u * 6, (1 - u) * 6));
    });
    run(this.o2, 1.6, .5); run(this.co2, 3.8, .5);
    this.lA.setAttribute('opacity', c.seg(t, .2, .5));
    this.lC.setAttribute('opacity', c.seg(t, .3, .6));
    const PO2 = c.lerp(40, 100, c.easeOut(c.seg(t, 1.8, 5.6))), PCO2 = c.lerp(46, 40, c.easeOut(c.seg(t, 3.9, 6.4)));
    document.getElementById('mO').style.width = PO2 + '%';
    document.getElementById('vO').textContent = Math.round(PO2);
    document.getElementById('mC').style.width = (PCO2 / 50 * 100) + '%';
    document.getElementById('vC').textContent = Math.round(PCO2);
  },
};
</script><script>/* Shared engine for the 8-second physiology explainers.
   Stage coordinates: every base SVG is drawn "contain" inside a 900x900 space,
   and the overlay <svg> uses viewBox 0 0 900 900, so overlay points match the art. */
(function () {
  const DUR = 8;
  const NS = 'http://www.w3.org/2000/svg';
  const S = window.SCENE;

  // ---------- math helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, u) => a + (b - a) * u;
  const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const easeOut = u => 1 - Math.pow(1 - u, 3);
  const frac = v => v - Math.floor(v);
  // window: fades in over [a, a+f], out over [b-f, b]
  const win = (t, a, b, f = .3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
  const pulse = (t, period = 1) => .5 - .5 * Math.cos(2 * Math.PI * t / period);
  const mix = (c1, c2, u) => {
    const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
    const a = p(c1), b = p(c2);
    return '#' + a.map((v, i) => Math.round(lerp(v, b[i], u)).toString(16).padStart(2, '0')).join('');
  };
  // integrate a speed function from 0..t (keeps particles continuous when speed changes)
  const integ = (fn, t, dt = 1 / 120) => { let s = 0; for (let x = 0; x < t; x += dt) s += fn(x) * Math.min(dt, t - x); return s; };

  // ---------- DOM helpers ----------
  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  // smooth Catmull-Rom path through points
  function smoothD(pts, closed) {
    if (pts.length < 3) return 'M' + pts.map(p => p.join(',')).join('L');
    const P = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : [pts[0], ...pts, pts[pts.length - 1]];
    let d = 'M' + pts[0].join(',');
    for (let i = 1; i < P.length - 2; i++) {
      const [p0, p1, p2, p3] = [P[i - 1], P[i], P[i + 1], P[i + 2]];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1.join(',')} ${c2.join(',')} ${p2.join(',')}`;
    }
    return d + (closed ? 'Z' : '');
  }
  function path(pts, attrs = {}, parent, closed) {
    const dbg = /debug/.test(location.search) && !attrs.stroke ? { stroke: '#00e676', 'stroke-width': 4 } : {};
    const p = el('path', Object.assign({ d: smoothD(pts, closed), fill: 'none' }, dbg, attrs), parent);
    p._len = p.getTotalLength();
    return p;
  }
  const at = (p, u) => { const q = p.getPointAtLength(clamp(u) * p._len); return [q.x, q.y]; };
  // progressive stroke reveal
  function reveal(p, u) { p.style.strokeDasharray = p._len; p.style.strokeDashoffset = p._len * (1 - clamp(u)); }

  // ---------- page scaffold ----------
  function stageBox(host, size, view, layers) {
    const [vx, vy, vs] = view || [0, 0, 900];
    const k = size / vs;
    const box = document.createElement('div');
    box.className = 'space';
    box.style.transform = `scale(${k}) translate(${-vx}px, ${-vy}px)`;
    const imgs = {};
    for (const name in layers) {
      const img = document.createElement('img');
      img.src = 'data:image/svg+xml;base64,' + window.__L[layers[name]];
      img.className = 'layer';
      box.appendChild(img);
      imgs[name] = img;
    }
    const svg = el('svg', { viewBox: '0 0 900 900', class: 'overlay' });
    svg.innerHTML = `<defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
      <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker>
    </defs>`;
    box.appendChild(svg);
    host.appendChild(box);
    return { imgs, svg };
  }

  const root = document.getElementById('root');
  root.style.setProperty('--accent', S.color);
  root.innerHTML = `
    <div class="stage"><div class="stage-inner" id="stage"></div><div class="badge">${S.num}/10</div></div>
    <div class="panel">
      <div class="kicker">Physiology · ${S.system}</div>
      <h1>${S.title}</h1>
      <ol class="steps">${S.steps.map((s, i) => `<li><span class="n">${i + 1}</span><span class="tx">${s.text}</span></li>`).join('')}</ol>
      <div class="widget" id="widget">${S.widget || ''}</div>
      <div class="take"><b>Key point</b>${S.takeaway.text}</div>
    </div>
    <div class="bar"><i id="prog"></i></div>`;

  const st = stageBox(document.getElementById('stage'), 640, S.view, S.layers);
  const ctx = {
    o: st.svg, imgs: st.imgs, el, set, path, at, reveal, smoothD,
    clamp, seg, lerp, ease, easeOut, frac, win, pulse, mix, integ, NS,
    widget: document.getElementById('widget'), stageBox,
    // pill label with optional leader line to (lx, ly)
    label(x, y, text, opts = {}) {
      const g = el('g', { opacity: 0 }, opts.parent || st.svg);
      if (opts.lx != null) el('line', { x1: x, y1: y, x2: opts.lx, y2: opts.ly, stroke: opts.color || '#1f2a44', 'stroke-width': 2.5 }, g);
      if (opts.lx != null) el('circle', { cx: opts.lx, cy: opts.ly, r: 5, fill: opts.color || '#1f2a44' }, g);
      const fs = opts.size || 25;
      const t = el('text', { x, y: y + fs * .35, 'font-size': fs, 'font-weight': 650, fill: '#fff', 'text-anchor': 'middle', 'font-family': 'Inter, sans-serif' }, g);
      t.textContent = text;
      const w = text.length * fs * .56 + 26, h = fs + 16;
      const r = el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: h / 2, fill: opts.color || '#1f2a44' }, g);
      g.insertBefore(r, t);
      return g;
    },
  };
  S.init && S.init(ctx);

  const lis = [...document.querySelectorAll('.steps li')];
  const take = document.querySelector('.take');
  const prog = document.getElementById('prog');

  function render(t) {
    S.steps.forEach((s, i) => {
      const li = lis[i];
      const shown = seg(t, s.t0 - .25, s.t0 + .15);
      li.style.opacity = t < s.t0 - .25 ? .0 : (t >= s.t1 ? .55 : lerp(.0, 1, shown));
      li.style.transform = `translateY(${(1 - easeOut(shown)) * 10}px)`;
      li.classList.toggle('on', t >= s.t0 && t < s.t1);
    });
    const ta = seg(t, S.takeaway.t, S.takeaway.t + .4);
    take.style.opacity = ta;
    take.style.transform = `translateY(${(1 - easeOut(ta)) * 12}px)`;
    prog.style.width = (t / DUR * 100) + '%';
    S.update(t, ctx);
  }
  window.renderFrame = render;
  window.DUR = DUR;

  if (!/capture/.test(location.search)) {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
})();
</script></body></html>
