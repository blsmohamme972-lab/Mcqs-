<svg xmlns="http://www.w3.org/2000/svg"><defs id="kit">
<filter id="kit-volume" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/><feOffset in="b" dx="-5" dy="-7" result="o1"/><feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/><feFlood flood-color="#3a0d12" flood-opacity=".30"/><feComposite in2="e1" operator="in" result="shade"/><feOffset in="b" dx="5" dy="7" result="o2"/><feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/><feFlood flood-color="#fff" flood-opacity=".45"/><feComposite in2="e2" operator="in" result="hi"/><feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="hi"/></feMerge><feComposite in2="SourceAlpha" operator="in"/></filter>
